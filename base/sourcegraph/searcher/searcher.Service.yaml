apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: "6060"
    sourcegraph.prometheus/scrape: "true"
  labels:
    app: searcher
    app.kubernetes.io/component: searcher
    deploy: sourcegraph
    sourcegraph-resource-requires: no-cluster-admin
  name: searcher
spec:
  clusterIP: None
  ports:
    - name: grpc
      port: 3181
      targetPort: grpc
    - name: http-debug
      port: 6060
      targetPort: http-debug
  selector:
    app: searcher
  type: ClusterIP
